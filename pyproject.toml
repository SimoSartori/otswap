[build-system]
requires = ["scikit-build-core >= 0.10", "nanobind >= 2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "otswap"
version = "0.1.0"
description = "Optimal transport reconstruction of the displacement field of a tracer catalogue, by local swapping"
requires-python = ">= 3.9"
license = { file = "LICENSE" }
authors = [{ name = "Simone Sartori" }]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/otswap"]

[tool.scikit-build.cmake.define]
OTSWAP_BUILD_PYTHON = "ON"
OTSWAP_BUILD_TESTS = "OFF"
OTSWAP_BUILD_EXAMPLES = "OFF"
