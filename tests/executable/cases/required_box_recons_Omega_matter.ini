# A box recons run without Omega_matter.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
perform_recons = true
little_h = 0.7
rsd_smoothing_scale = 10
redshift = 1
bias = 1.5
los_axis = 2
printRecCat = true

