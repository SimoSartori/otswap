# A periodic box whose sides are not integer multiples of the shortest.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = x y z
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
box_min = 269 269 269
box_max = 369 369 419
periodic = true

# Expected (tests/executable/run_case.cmake)
#! exit 1
#! stderr otswap: error: the periodic box has sides 100.000000, 100.000000, 150.000000; the side on axis z is not an integer multiple of the shortest one, which every side of a periodic box must be
