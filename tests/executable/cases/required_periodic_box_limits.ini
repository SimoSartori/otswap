# periodic without the box limits.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = x y z
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
periodic = true

