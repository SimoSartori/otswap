# A lightcone recons run without rsd_smoothing_scale.

geometry = lightcone
verbosity = silent
tracer_file = @EXAMPLES_DATA@/lightcone_tracers.dat
column_tracer = 0 1 2
random_file = @EXAMPLES_DATA@/lightcone_randoms.dat
column_random = 0 1 2
units = degrees
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
z_min = 0.95
z_max = 1.0
Omega_matter = 0.286
little_h = 0.7
Nrec = 1
seed = 7
bins = 10
output_dir = out
output_file = lightcone
printDisplMean = true
perform_recons = true
bias_file = @EXAMPLES_DATA@/lightcone_bias.dat
printRecCat = true

# Expected (tests/executable/run_case.cmake)
#! exit 1
#! stderr otswap: error: required_lightcone_recons_rsd_smoothing_scale.ini: key 'rsd_smoothing_scale' is missing
