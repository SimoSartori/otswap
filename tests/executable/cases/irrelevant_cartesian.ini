# z_min, z_max and units do not apply to a Cartesian lightcone.

geometry = lightcone
lightcone_input = cartesian
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers_cartesian.dat
column_tracer = 0 1 2
random_file = @TEST_DATA@/lightcone_randoms_cartesian.dat
column_random = 0 1 2
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
d_min = 2200
d_max = 2400
Nrec = 1
seed = 7
bins = 4
output_dir = out
output_file = lightcone
units = degrees
z_min = 0.9
z_max = 1
printDisplMean = true

