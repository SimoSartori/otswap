# Every key that does not apply to a box (U2); bins with a broken value.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
perform_recons = true
Omega_matter = 0.3
little_h = 0.7
rsd_smoothing_scale = 10
