# Every key a box uses only with perform_recons, in a run without it (U3).

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
perform_recons = false
Omega_matter = 0.3
little_h = 0.7
w0 = -1
wa = 0
rsd_smoothing_scale = 10
rsd_weight_by_realizations = true
redshift = 1
bias = 1.5
los_axis = 2
printRecCat = true

# Expected (tests/executable/run_case.cmake)
