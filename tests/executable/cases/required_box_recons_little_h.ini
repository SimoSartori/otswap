# A box recons run without little_h.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
perform_recons = true
Omega_matter = 0.3
rsd_smoothing_scale = 10
redshift = 1
bias = 1.5
los_axis = 2
printRecCat = true

