# max_unobserved_pixels_crossed with reject_mask_crossings = false (U3).

geometry = lightcone
verbosity = silent
tracer_file = @EXAMPLES_DATA@/lightcone_tracers.dat
column_tracer = 0 1 2
random_file = @EXAMPLES_DATA@/lightcone_randoms.dat
column_random = 0 1 2
units = degrees
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
z_min = 0.95
z_max = 1.0
Omega_matter = 0.286
little_h = 0.7
Nrec = 1
seed = 7
bins = 10
output_dir = out
output_file = lightcone
printDisplMean = true
reject_mask_crossings = false
max_unobserved_pixels_crossed = 2

