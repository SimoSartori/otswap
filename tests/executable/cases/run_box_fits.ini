# A box with IDs, given randoms, limits, a given mps and the correction, FITS.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = x y z
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
id_column = id
random_file = @EXAMPLES_DATA@/box_randoms.dat
column_random = 0 1 2
box_min = 269 269 269
box_max = 369 369 369
mps = 15
perform_recons = true
Omega_matter = 0.3
little_h = 0.7
rsd_smoothing_scale = 10
rsd_weight_by_realizations = true
redshift = 1
bias = 1.5
los_axis = 2
output_format = fits
printDisplComplete = true
printRecCat = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/displacement_mean_zspace_box.fits
#! file out/displacement_complete_zspace_box.fits
#! file out/reconstructed_catalogue_box.fits
