# A box recons run without rsd_smoothing_scale.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
perform_recons = true
Omega_matter = 0.3
little_h = 0.7
redshift = 1
bias = 1.5
los_axis = 2
printRecCat = true

