#! stderr otswap: error: irrelevant_lightcone_no_recons.ini:23: key 'bias_file': does not apply to a run without perform_recons
#! stderr otswap: error: irrelevant_lightcone_no_recons.ini:24: key 'printRecCat': does not apply to a run without perform_recons
