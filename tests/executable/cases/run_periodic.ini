# A periodic box smaller than the tracers: they are wrapped; correction and every output, ASCII.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = x y z
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
printDisplComplete = true
box_min = 290 290 290
box_max = 350 350 350
periodic = true
perform_recons = true
Omega_matter = 0.3
little_h = 0.7
rsd_smoothing_scale = 10
redshift = 1
bias = 1.5
los_axis = 2
printRecCat = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/displacement_mean_zspace_box.dat
#! file out/displacement_complete_zspace_box.dat
#! file out/reconstructed_catalogue_box.dat
#! contains out/displacement_complete_zspace_box.dat ## PERIODIC = 1 /
#! contains out/displacement_complete_zspace_box.dat ## NTRWRAP =
#! contains out/displacement_mean_zspace_box.dat ## PERIODIC = 1 /
#! contains out/displacement_mean_zspace_box.dat ## BOXXLO = 290 /
