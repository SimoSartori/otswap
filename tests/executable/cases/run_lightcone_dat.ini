# A lightcone with a redshift cut and the correction, every output, ASCII.

geometry = lightcone
verbosity = silent
tracer_file = @EXAMPLES_DATA@/lightcone_tracers.dat
column_tracer = 0 1 2
random_file = @EXAMPLES_DATA@/lightcone_randoms.dat
column_random = 0 1 2
units = degrees
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
z_min = 0.95
z_max = 1.0
Omega_matter = 0.286
little_h = 0.7
Nrec = 1
seed = 7
bins = 10
output_dir = out
output_file = lightcone
printDisplMean = true
perform_recons = true
rsd_smoothing_scale = 10
bias_file = @EXAMPLES_DATA@/lightcone_bias.dat
printRecCat = true
printDisplComplete = true
printMps = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/displacement_mean_zspace_lightcone.dat
#! file out/displacement_complete_zspace_lightcone.dat
#! file out/displacement_complete_zspace_lightcone.mps.dat
#! file out/displacement_complete_zspace_lightcone.distances.dat
#! file out/MPS_zspace_lightcone.dat
#! file out/reconstructed_catalogue_lightcone.dat
