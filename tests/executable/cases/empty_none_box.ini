# A box whose keys without a default are set with no value, "key =", the
# same as leaving them out: drawn randoms, no IDs, the bounding box, the
# mps measured.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
id_column =
random_file =
box_min =
box_max =
mps =
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/displacement_mean_box.dat
