# A box with drawn randoms, every output of a box, ASCII.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true
printDisplComplete = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/displacement_mean_box.dat
#! file out/displacement_complete_box.dat
