# A Cartesian lightcone with a distance cut and no cosmology: no redshifts, so no distance table in the files.

geometry = lightcone
lightcone_input = cartesian
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers_cartesian.dat
column_tracer = 0 1 2
random_file = @TEST_DATA@/lightcone_randoms_cartesian.dat
column_random = 0 1 2
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
d_min = 2200
d_max = 2400
Nrec = 1
seed = 7
bins = 4
output_dir = out
output_file = lightcone
printDisplMean = true
printDisplComplete = true
printMps = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/displacement_mean_lightcone.dat
#! file out/displacement_mean_lightcone.mps.dat
#! file out/displacement_complete_lightcone.dat
#! file out/displacement_complete_lightcone.mps.dat
