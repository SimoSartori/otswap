# A Cartesian lightcone with a cosmology: the table is built and kept, as the library's optional table.

geometry = lightcone
lightcone_input = cartesian
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers_cartesian.dat
column_tracer = 0 1 2
random_file = @TEST_DATA@/lightcone_randoms_cartesian.dat
column_random = 0 1 2
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
d_min = 2200
d_max = 2400
Nrec = 1
seed = 7
bins = 4
output_dir = out
output_file = lightcone
Omega_matter = 0.286
little_h = 0.7
printDisplMean = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/displacement_mean_lightcone.dat
#! file out/displacement_mean_lightcone.mps.dat
#! file out/displacement_mean_lightcone.distances.dat
