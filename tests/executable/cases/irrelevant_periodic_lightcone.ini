# periodic does not apply to a lightcone.

geometry = lightcone
verbosity = silent
tracer_file = @EXAMPLES_DATA@/lightcone_tracers.dat
column_tracer = 0 1 2
random_file = @EXAMPLES_DATA@/lightcone_randoms.dat
column_random = 0 1 2
units = degrees
Omega_matter = 0.286
little_h = 0.7
bins = 10
output_dir = out
output_file = lightcone
printDisplMean = true
periodic = true

