# printMps with the mean displacements on a lightcone: the mean file and its twin hold the profile,
# so no file of its own is written.

geometry = lightcone
verbosity = normal
tracer_file = @EXAMPLES_DATA@/lightcone_tracers.dat
column_tracer = 0 1 2
random_file = @EXAMPLES_DATA@/lightcone_randoms.dat
column_random = 0 1 2
units = degrees
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
z_min = 0.95
z_max = 1.0
Omega_matter = 0.286
little_h = 0.7
Nrec = 1
seed = 7
bins = 10
output_dir = out
output_file = lightcone
printDisplMean = true
printMps = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! wrote otswap: wrote out/displacement_mean_lightcone.dat
#! wrote otswap: wrote out/displacement_mean_lightcone.mps.dat
#! wrote otswap: wrote out/displacement_mean_lightcone.distances.dat
#! listing out
#! file out/displacement_mean_lightcone.dat
#! file out/displacement_mean_lightcone.mps.dat
#! file out/displacement_mean_lightcone.distances.dat
