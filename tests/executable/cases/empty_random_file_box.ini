# random_file with no value in a box: no random file, so column_random does
# not apply.

geometry = box
verbosity = silent
tracer_file = @TEST_DATA@/box_ids.dat
column_tracer = 0 1 2
random_file =
column_random = 0 1 2
Nrec = 1
seed = 7
output_dir = out
output_file = box
printDisplMean = true

# Expected (tests/executable/run_case.cmake)
#! exit 1
