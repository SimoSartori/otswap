# A Cartesian lightcone with the correction: the cosmology and the bias file are required.

geometry = lightcone
lightcone_input = cartesian
verbosity = silent
tracer_file = @TEST_DATA@/lightcone_tracers_cartesian.dat
column_tracer = 0 1 2
random_file = @TEST_DATA@/lightcone_randoms_cartesian.dat
column_random = 0 1 2
veto_mask_filename = @EXAMPLES_DATA@/lightcone_mask.fits
d_min = 2200
d_max = 2400
Nrec = 1
seed = 7
bins = 4
output_dir = out
output_file = lightcone
Omega_matter = 0.286
little_h = 0.7
perform_recons = true
rsd_smoothing_scale = 10
bias_file = @EXAMPLES_DATA@/lightcone_bias.dat
printRecCat = true

# Expected (tests/executable/run_case.cmake)
#! exit 0
#! listing out
#! file out/reconstructed_catalogue_lightcone.dat
