# The parameters of the reconstruction without a distance table in the
# lightcone_cartesian example, examples/lightcone_cartesian: run from the
# repository root, displacement_mean_lightcone_cartesian.dat must equal its
# output/displacement_lightcone_cartesian_no_table.dat byte for byte.
#
# Every key that applies to this run is set, those at their default
# included; check_example_keys.cmake fails when one is missing. "key =",
# with no value, means "none" for the keys that accept it, the same as
# leaving the key out. Without the cosmology keys no distance table is
# built.

geometry = lightcone
lightcone_input = cartesian
verbosity = normal
tracer_file = examples/data/lightcone_tracers_cartesian.dat
column_tracer = 0 1 2
id_column =
random_file = examples/data/lightcone_randoms_cartesian.dat
column_random = 0 1 2
delimiter = " "
comment = "#"
veto_mask_filename = examples/data/lightcone_mask.fits
d_min = 2200
d_max = 2450
Nrec = 8
threshold = 1e-2
seed = 12345
mesh_cellsize = 3
bins = 30
reject_mask_crossings = true
max_unobserved_pixels_crossed = 0
perform_recons = false
output_dir = build-executable-examples
output_file = lightcone_cartesian
output_format = dat
printDisplMean = true
printDisplComplete = false
printMps = false
