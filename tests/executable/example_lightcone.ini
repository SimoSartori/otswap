# The parameters of the lightcone example, examples/lightcone: run from the
# repository root, displacement_mean_lightcone.dat must equal its
# output/displacement_lightcone.dat byte for byte.
#
# Every key that applies to this run is set, those at their default
# included; check_example_keys.cmake fails when one is missing. "key =",
# with no value, means "none" for the keys that accept it, the same as
# leaving the key out.

geometry = lightcone
verbosity = normal
tracer_file = examples/data/lightcone_tracers.dat
column_tracer = 0 1 2
id_column =
random_file = examples/data/lightcone_randoms.dat
column_random = 0 1 2
units = degrees
delimiter = " "
comment = "#"
veto_mask_filename = examples/data/lightcone_mask.fits
z_min = 0.885
z_max = 1.10
Omega_matter = 0.286
little_h = 0.7
w0 = -1
wa = 0
Nrec = 8
threshold = 1e-2
seed = 12345
mesh_cellsize = 4
bins = 30
reject_mask_crossings = true
max_unobserved_pixels_crossed = 0
perform_recons = false
output_dir = build-executable-examples
output_file = lightcone
output_format = dat
printDisplMean = true
printDisplComplete = false
printMps = false
