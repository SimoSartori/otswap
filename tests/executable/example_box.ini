# The parameters of the box example, examples/box: run from the repository
# root, displacement_mean_box.dat must equal its output/displacement_box.dat
# byte for byte. verbosity = detailed for the file's VERBOSE keyword.
#
# Every key that applies to this run is set, those at their default
# included; check_example_keys.cmake fails when one is missing. "key =",
# with no value, means "none" for the keys that accept it, the same as
# leaving the key out.

geometry = box
verbosity = detailed
tracer_file = examples/data/box_halos_real_space.dat
column_tracer = 0 1 2
id_column =
random_file = examples/data/box_randoms.dat
column_random = 0 1 2
delimiter = " "
comment = "#"
Nrec = 8
threshold = 1e-2
seed = 12345
mesh_cellsize = 4
box_min =
box_max =
mps =
perform_recons = false
output_dir = build-executable-examples
output_file = box
output_format = dat
printDisplMean = true
printDisplComplete = false
