# The parameters of the box example, examples/box: run from the repository
# root, displacement_mean_box.dat must equal its output/displacement_box.dat
# byte for byte. verbosity = detailed for the file's VERBOSE keyword.

geometry = box
verbosity = detailed
tracer_file = examples/data/box_halos_real_space.dat
column_tracer = 0 1 2
random_file = examples/data/box_randoms.dat
column_random = 0 1 2
Nrec = 8
threshold = 1e-2
seed = 12345
mesh_cellsize = 4
output_dir = build-executable-examples
output_file = box
printDisplMean = true
