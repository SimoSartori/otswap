name: CI

# Builds and tests the C++ library, the Python module and the CMake package
# on every push to main and every pull request: with GCC and clang on Linux and with Apple
# clang on macOS, warnings as errors; then the module alone on Python 3.10,
# 3.12 and 3.14.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Apple clang
            os: macos-latest
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # GCC brings libgomp; clang on Linux needs libomp.
      - name: Install cfitsio and OpenMP
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcfitsio-dev libomp-dev

      # Homebrew's libomp is keg-only: otswap, and its installed package,
      # find it without OpenMP_ROOT.
      - name: Install cfitsio and libomp
        if: runner.os == 'macOS'
        run: |
          brew install cfitsio libomp
          echo "CFITSIO_ROOT=$(brew --prefix cfitsio)" >> "$GITHUB_ENV"

      # The bindings and _otswap_crosstest are built with the tests, for
      # tests/test_crossmodule.py.
      - name: Install nanobind
        run: python -m pip install nanobind==3.1.0

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DOTSWAP_BUILD_PYTHON=ON \
            -DPython_EXECUTABLE="$(command -v python)" | tee configure.log
          # without OpenMP every test would still pass, serially
          grep -q "Found OpenMP_CXX" configure.log

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Every translation unit is compiled without FP contraction or math errno
        run: |
          python3 - <<'PY'
          import json, sys
          entries = json.load(open("build/compile_commands.json"))
          bad = 0
          for flag in ("-ffp-contract=off", "-fno-math-errno"):
              missing = [e["file"] for e in entries
                         if flag not in e.get("command", " ".join(e.get("arguments", [])))]
              print(len(entries), "translation units;", len(missing), "without", flag)
              bad += len(missing)
          sys.exit(1 if bad or not entries else 0)
          PY

      # The bit-identity tests compare the module with the C++ library built
      # above; test_determinism.py compares both thread counts with the
      # hashes recorded in tests/determinism_hashes.json.
      - name: Build and install the module
        run: pip install ".[test]"

      # Run from outside the source tree, so that the installed module is the
      # one imported.
      - name: Python tests
        working-directory: ${{ runner.temp }}
        env:
          OTSWAP_CPP_REFERENCE: ${{ github.workspace }}/build/cpp_reference
          OTSWAP_CROSSTEST_DIR: ${{ github.workspace }}/build/crossmodule
        run: >-
          python -m pytest
          "$GITHUB_WORKSPACE/tests/test_otswap.py"
          "$GITHUB_WORKSPACE/tests/test_rsd.py"
          "$GITHUB_WORKSPACE/tests/test_determinism.py"
          "$GITHUB_WORKSPACE/tests/test_crossmodule.py"
          -p no:cacheprovider -rs

      # The C++ install rules and the executable are off under
      # scikit-build-core.
      - name: The module installs no C++ library, header or CMake file
        run: |
          if pip show -f otswap | grep -E '\.(a|h|cmake)$|(^|/)bin/otswap$'; then
            exit 1
          fi

      # The package must work from wherever its prefix ends up.
      - name: Install, then move the prefix
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/prefix"
          mv "$RUNNER_TEMP/prefix" "$RUNNER_TEMP/moved"

      - name: The installed files
        working-directory: ${{ runner.temp }}/moved
        run: |
          headers=$(find include -type f | LC_ALL=C sort | tr '\n' ' ')
          expected="include/meshsearch/MeshGrid.h include/otswap/Maths.h include/otswap/OT.h include/otswap/ParameterFile.h include/otswap/RSD.h include/otswap/Random.h include/otswap/io.h "
          if [ "$headers" != "$expected" ]; then
            echo "installed headers: $headers"
            exit 1
          fi
          # no path of this machine: the checkout, the build, the prefix, cfitsio
          if grep -rlF -e "$GITHUB_WORKSPACE" -e "$RUNNER_TEMP" -e libcfitsio lib/cmake; then
            echo "the files above hold a build-machine path"
            exit 1
          fi
          # the vendored Healpix is the tests' reference only
          if nm -C lib/libotswap.a | grep -E "T_Healpix_Base|Healpix_Tables|PlanckError"; then
            echo "libotswap.a holds Healpix code"
            exit 1
          fi
          # the executable runs from the moved prefix: with no argument it
          # prints its usage line and exits 1
          test -x bin/otswap
          status=0
          ./bin/otswap 2> usage.txt || status=$?
          if [ "$status" != 1 ] || [ "$(cat usage.txt)" != "usage: otswap <parameter-file>" ]; then
            echo "bin/otswap with no argument: exit $status, stderr: $(cat usage.txt)"
            exit 1
          fi
          rm usage.txt

      # find_package(otswap CONFIG) against the moved tree
      - name: Consume the installed package
        run: |
          cmake -S tests/cmake/install -B build-install-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/moved"
          cmake --build build-install-consumer
          ./build-install-consumer/consumer

      # Each example is a project of its own, built against the moved package.
      - name: Build the C++ examples
        run: |
          for d in box lightcone full_recons_lightcone full_recons_box periodic_box lightcone_cartesian; do
            cmake -S examples/$d -B build-examples/$d -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/moved" \
              -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_CXX_FLAGS="-Wall -Wextra"
            cmake --build build-examples/$d
          done

      # With a fixed seed the C++ and the Python examples write the same files.
      - name: Run the examples, C++ then Python, and compare their outputs
        run: |
          for d in box lightcone full_recons_lightcone full_recons_box periodic_box lightcone_cartesian; do
            "./build-examples/$d/$d"
            mv "examples/$d/output" "examples/$d/output-cpp"
            python "examples/$d/$d.py"
            diff -r "examples/$d/output-cpp" "examples/$d/output"
          done

      # The executable on the examples' parameters writes the examples' files,
      # byte for byte, twin files included. examples/executable/*.ini are the
      # commented ones of the docs; tests/executable/example_*.ini hold the
      # parameters of the box and lightcone examples and of the run without
      # a distance table of the lightcone_cartesian example.
      - name: Run the executable on the examples' parameters and compare
        run: |
          otswap="$RUNNER_TEMP/moved/bin/otswap"
          "$otswap" examples/executable/box.ini
          "$otswap" examples/executable/lightcone.ini
          "$otswap" examples/executable/periodic_box.ini
          "$otswap" examples/executable/lightcone_cartesian.ini
          "$otswap" tests/executable/example_box.ini
          "$otswap" tests/executable/example_lightcone.ini
          "$otswap" tests/executable/example_lightcone_cartesian.ini
          cmp examples/executable/output/reconstructed_catalogue_box.dat \
            examples/full_recons_box/output-cpp/reconstructed_catalogue_box.dat
          cmp examples/executable/output/reconstructed_catalogue_lightcone.dat \
            examples/full_recons_lightcone/output-cpp/reconstructed_catalogue_lightcone.dat
          cmp examples/executable/output/reconstructed_catalogue_lightcone_cartesian.dat \
            examples/lightcone_cartesian/output-cpp/reconstructed_catalogue_lightcone_cartesian.dat
          for twin in "" .mps .distances; do
            cmp examples/executable/output/displacement_mean_zspace_lightcone_cartesian$twin.dat \
              examples/lightcone_cartesian/output-cpp/displacement_lightcone_cartesian$twin.dat
          done
          cmp examples/executable/output/displacement_mean_zspace_periodic_box.dat \
            examples/periodic_box/output-cpp/displacement_periodic_box.dat
          cmp examples/executable/output/reconstructed_catalogue_periodic_box.dat \
            examples/periodic_box/output-cpp/reconstructed_catalogue_periodic_box.dat
          cmp build-executable-examples/displacement_mean_box.dat examples/box/output-cpp/displacement_box.dat
          for twin in "" .mps .distances; do
            cmp build-executable-examples/displacement_mean_lightcone$twin.dat \
              examples/lightcone/output-cpp/displacement_lightcone$twin.dat
          done
          for twin in "" .mps; do
            cmp build-executable-examples/displacement_mean_lightcone_cartesian$twin.dat \
              examples/lightcone_cartesian/output-cpp/displacement_lightcone_cartesian_no_table$twin.dat
          done

      # add_subdirectory on the source tree: no tests, no example, no
      # executable, no build type
      - name: Consume the source tree as a subproject
        run: |
          cmake -S tests/cmake/subproject -B build-subproject-consumer -DOTSWAP_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-subproject-consumer --parallel
          ./build-subproject-consumer/consumer
          if find build-subproject-consumer -name otswap -type f | grep .; then
            echo "the subproject build holds an otswap executable"
            exit 1
          fi

      # An installed meshsearch of the same minor version is used, not fetched.
      - name: Build against an installed meshsearch
        run: |
          cmake -S . -B build-found -DOTSWAP_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/moved" \
            | tee found.log
          grep -q "otswap: using meshsearch 0.3" found.log
          test ! -d build-found/_deps/meshsearch-src
          cmake --build build-found --parallel

  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.12", "3.14"]

    # The module built from source, in a clean environment, on the oldest, a
    # middle and the newest Python the wheels cover. The bit-identity tests
    # against the C++ library run in the job above and are skipped here.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # GCC, the default compiler on Linux, brings libgomp.
      - name: Install cfitsio
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcfitsio-dev

      - name: Install cfitsio and libomp
        if: runner.os == 'macOS'
        run: |
          brew install cfitsio libomp
          echo "CFITSIO_ROOT=$(brew --prefix cfitsio)" >> "$GITHUB_ENV"

      - name: Build and install the module
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install ".[test]"

      # Run from outside the source tree, so that the installed module is the
      # one imported.
      - name: Test
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/venv/bin/python" -m pytest
          "$GITHUB_WORKSPACE/tests/test_otswap.py"
          "$GITHUB_WORKSPACE/tests/test_rsd.py"
          "$GITHUB_WORKSPACE/tests/test_determinism.py"
          -p no:cacheprovider -rs
