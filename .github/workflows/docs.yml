name: Docs

# Builds the documentation on every push and pull request, so a broken
# reference or a malformed docstring fails here and not silently. Publishing to
# Pages happens only from main. Deliberately separate from release.yml: a docs
# failure must never stand between a tag and PyPI.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen

      # The package is not built: the Python reference is read from the type
      # stubs, and the C++ one from the headers.
      - name: Install the documentation toolchain
        run: pip install -r docs/requirements.txt

      - name: Build
        # -W: a warning is a failure. An unresolved reference or a docstring
        # Sphinx cannot parse should break the build, not reach the site.
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
