name: Wheels

# Builds and tests a reduced set of wheels, one CPython version on Linux
# x86_64 and on macOS arm64, with the configuration in pyproject.toml. Runs
# only when started by hand, from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: cp312-manylinux_x86_64
          - os: macos-latest
            build: cp312-macosx_arm64

    steps:
      - uses: actions/checkout@v7

      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: ${{ matrix.build }}
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.build }}
          path: wheelhouse/*.whl
