# The otswap executable on the full_recons_lightcone example: a
# reconstruction of a lightcone, in redshift space, then the correction to
# real space.
#
#   otswap examples/executable/lightcone.ini
#
# run from the repository root: relative paths resolve against the current
# directory. Every key that applies to a lightcone is listed; those left at
# their default are commented out. The keys are described in
# docs/executable.md.

# ---------------------------------------------------------------- Run

# box or lightcone; required
geometry = lightcone

# what the run reports on stderr: silent, normal or detailed; default normal
# verbosity = normal

# ---------------------------------------------------------------- Input

# the tracers, ASCII or FITS by extension; required
tracer_file = examples/data/lightcone_tracers.dat

# their right ascension, declination and redshift columns: indices from 0,
# or names; required
column_tracer = 0 1 2

# an integer column of the tracer file read as the tracers' IDs; default none
# id_column = 3

# the randoms; required
random_file = examples/data/lightcone_randoms.dat

# their right ascension, declination and redshift columns; required
column_random = 0 1 2

# the unit of the angles of tracers and randoms: degrees or radians; required
units = degrees

# the column separator of every ASCII input, bias file included, " " for a
# space, \t for a tab; default " "
# delimiter = " "

# the character that starts a comment line in every ASCII input; default #
# comment = "#"

# ---------------------------------------------------------------- Selection

# the HEALPix FITS map of the observed sky; also gives the sky area; required
veto_mask_filename = examples/data/lightcone_mask.fits

# the redshift cut, applied to tracers and randoms; default none
# z_min = 0.885
# z_max = 1.10

# ---------------------------------------------------------------- Cosmology
# a flat w0-wa cosmology: redshifts to distances, and the growth rate

# Omega_m; required
Omega_matter = 0.286

# H0 / (100 km/s/Mpc); required
little_h = 0.7

# the dark energy equation of state, w(a) = w0 + wa (1 - a); default -1 and 0
# w0 = -1
# wa = 0

# ---------------------------------------------------------------- Reconstruction

# number of realizations, each on its own subset of the randoms; default 30
Nrec = 8

# convergence threshold of the swap loop, in (0, 1); default 1e-3
threshold = 1e-2

# seed of the random streams; default 0: one is drawn, and written in the
# displacement files
seed = 12345

# grid cell size, in mean particle separations; changes the speed only;
# default 4
# mesh_cellsize = 4

# number of redshift bins of the mean particle separation profile; required
bins = 30

# reject a displacement whose path crosses unobserved pixels; default true
# reject_mask_crossings = true

# the distinct unobserved pixels a path may cross before it is rejected; 0
# rejects at the first; only with reject_mask_crossings; default 0
# max_unobserved_pixels_crossed = 0

# ---------------------------------------------------------------- RSD correction

# move the tracers to real space after the reconstruction; default false
perform_recons = true

# width of the gaussian average of the displacements, in Mpc/h, 0 for none;
# required with perform_recons
rsd_smoothing_scale = 10

# weight each neighbour by its number of valid realizations; default false
# rsd_weight_by_realizations = false

# the tracers' linear bias b(z), ASCII columns redshift and bias, or a FITS
# table with REDSHIFT and BIAS; required with perform_recons
bias_file = examples/data/lightcone_bias.dat

# ---------------------------------------------------------------- Output

# the folder of the output files, created if missing; required
output_dir = examples/executable/output

# the name in every output file, not a path; required
output_file = lightcone

# dat (ASCII) or fits; default dat
# output_format = dat

# the mean displacement of each tracer, displacement_mean_[zspace_]<name>;
# default false
# printDisplMean = false

# every realization, displacement_complete_[zspace_]<name>; default false
# printDisplComplete = false

# the mean particle separation profile, MPS_[zspace_]<name>; default false
# printMps = false

# the corrected catalogue, reconstructed_catalogue_<name>; must be true with
# perform_recons
printRecCat = true
