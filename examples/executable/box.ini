# The otswap executable on the full_recons_box example: a reconstruction of
# halos in a box, in redshift space, then the correction to real space.
#
#   otswap examples/executable/box.ini
#
# run from the repository root: relative paths resolve against the current
# directory. Every key that applies to a box is listed; those left at their
# default are commented out. The keys are described in docs/executable.md.

# ---------------------------------------------------------------- Run

# box or lightcone; required
geometry = box

# what the run reports on stderr: silent, normal or detailed; default normal
# verbosity = normal

# ---------------------------------------------------------------- Input

# the tracers, ASCII or FITS by extension; required
tracer_file = examples/data/box_halos_redshift_space.dat

# their x, y, z columns, in any unit, which every length below shares:
# indices from 0, or names; required
column_tracer = 0 1 2

# an integer column of the tracer file read as the tracers' IDs; default none
# id_column = 3

# the randoms; default none: drawn uniformly in the box given by box_min and
# box_max, or without it in the tracers' bounding box
random_file = examples/data/box_randoms.dat

# their x, y, z columns; required with random_file
column_random = 0 1 2

# the column separator of every ASCII input, " " for a space, \t for a tab;
# default " "
# delimiter = " "

# the character that starts a comment line in every ASCII input; default #
# comment = "#"

# ---------------------------------------------------------------- Cosmology
# only for the growth rate at the box's redshift, so only with perform_recons

# Omega_m of a flat w0-wa cosmology; required with perform_recons
Omega_matter = 0.3186

# H0 / (100 km/s/Mpc); required with perform_recons
little_h = 0.67

# the dark energy equation of state, w(a) = w0 + wa (1 - a); default -1 and 0
# w0 = -1
# wa = 0

# ---------------------------------------------------------------- Reconstruction

# number of realizations, each on its own subset of the randoms; default 30
Nrec = 8

# convergence threshold of the swap loop, in (0, 1); default 1e-3
threshold = 1e-2

# seed of the random streams; default 0: one is drawn, and written in the
# displacement files
seed = 12345

# grid cell size, in mean particle separations; changes the speed only;
# default 4
# mesh_cellsize = 4

# the box, lower and upper x, y, z in coordinate units, both or neither;
# default none:
# the bounding box of the tracers and the randoms. When the volume is known,
# give it: the mean particle separation then comes from its volume, not from
# the bounding box
# box_min = 269 269 269
# box_max = 669 669 669

# the mean particle separation, in coordinate units; default none: computed
# from the
# tracers
# mps = 10

# ---------------------------------------------------------------- RSD correction

# move the tracers to real space after the reconstruction; default false
perform_recons = true

# width of the gaussian average of the displacements, in coordinate units,
# 0 for none;
# required with perform_recons
rsd_smoothing_scale = 10

# weight each neighbour by its number of valid realizations; default false
# rsd_weight_by_realizations = false

# the box's redshift, in [0, 10]; required with perform_recons
redshift = 1

# the tracers' linear bias; required with perform_recons
bias = 1.91255

# the line of sight: 0, 1 or 2 for x, y or z; required with perform_recons
los_axis = 1

# ---------------------------------------------------------------- Output

# the folder of the output files, created if missing; required
output_dir = examples/executable/output

# the name in every output file, not a path; required
output_file = box

# dat (ASCII) or fits; default dat
# output_format = dat

# the mean displacement of each tracer, displacement_mean_[zspace_]<name>;
# default false
# printDisplMean = false

# every realization, displacement_complete_[zspace_]<name>; default false
# printDisplComplete = false

# the corrected catalogue, reconstructed_catalogue_<name>; must be true with
# perform_recons
printRecCat = true
