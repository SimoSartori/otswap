# The otswap executable on the lightcone example given in Cartesian
# coordinates (x, y, z in Mpc/h, the observer at the origin): a reconstruction
# in redshift space, then the correction to real space.
#
#   otswap examples/executable/lightcone_cartesian.ini
#
# run from the repository root: relative paths resolve against the current
# directory. Every key that applies to this run is set, those at their
# default included. "key =", with no value, means "none" for the keys that
# accept it, the same as leaving the key out. The keys are described in
# docs/executable.md.

# ---------------------------------------------------------------- Run

# box or lightcone; required
geometry = lightcone

# the lightcone's input: sky (right ascension, declination, redshift) or
# cartesian (x, y, z); default sky
lightcone_input = cartesian

# what the run reports on stderr: silent, normal or detailed; default normal
verbosity = normal

# ---------------------------------------------------------------- Input

# the tracers, ASCII or FITS by extension; required
tracer_file = examples/data/lightcone_tracers_cartesian.dat

# their x, y and z columns, in coordinate units: indices from 0, or names;
# required
column_tracer = 0 1 2

# an integer column of the tracer file read as the tracers' IDs, such as 3;
# default none
id_column =

# the randoms; required
random_file = examples/data/lightcone_randoms_cartesian.dat

# their x, y and z columns; required
column_random = 0 1 2

# the column separator of every ASCII input, bias file included, " " for a
# space, \t for a tab; default " "
delimiter = " "

# the character that starts a comment line in every ASCII input; default #
comment = "#"

# ---------------------------------------------------------------- Selection

# the HEALPix FITS map of the observed sky; also gives the sky area; required
veto_mask_filename = examples/data/lightcone_mask.fits

# the cut on the comoving distance from the origin, applied to tracers and
# randoms, in coordinate units; the catalogue spans 2126 to 2500; default none
d_min = 2200
d_max = 2450

# ---------------------------------------------------------------- Cosmology
# a flat w0-wa cosmology: its table gives the tracers' redshifts, and the
# growth rate of the correction. Optional for the reconstruction, all of it
# or none; required with perform_recons. Its distances are in Mpc/h, so the
# coordinates must then be in Mpc/h too

# Omega_m
Omega_matter = 0.286

# H0 / (100 km/s/Mpc)
little_h = 0.7

# the dark energy equation of state, w(a) = w0 + wa (1 - a); default -1 and 0
w0 = -1
wa = 0

# ---------------------------------------------------------------- Reconstruction

# number of realizations, each on its own subset of the randoms; default 30;
# the example randoms are enough for 8, and 8 keeps the example fast. For an
# analysis, start from the defaults of Nrec and threshold: the guide's section
# "Choosing the parameters" advises on both
Nrec = 8

# convergence threshold of the swap loop, in (0, 1); default 1e-3; 1e-2
# keeps the example fast
threshold = 1e-2

# seed of the random streams; default 0: one is drawn, and written in the
# displacement files
seed = 12345

# grid cell size, in mean particle separations; changes the speed only;
# default 3
mesh_cellsize = 3

# number of distance bins of the mean particle separation profile; required
bins = 30

# reject a displacement whose path crosses unobserved pixels; default true
reject_mask_crossings = true

# the unobserved pixels in a row a path may cross before it is rejected; 0
# rejects at the first; only with reject_mask_crossings; default 0
max_unobserved_pixels_crossed = 0

# ---------------------------------------------------------------- RSD correction

# move the tracers to real space after the reconstruction; default false
perform_recons = true

# width of the gaussian average of the displacements, in coordinate units,
# 0 for none; required with perform_recons
rsd_smoothing_scale = 10

# weight each neighbour by its number of valid realizations; default false
rsd_weight_by_realizations = false

# the tracers' linear bias b(z), ASCII columns redshift and bias, or a FITS
# table with REDSHIFT and BIAS; required with perform_recons
bias_file = examples/data/lightcone_bias.dat

# ---------------------------------------------------------------- Output

# the folder of the output files, created if missing; required
output_dir = examples/executable/output

# the name in every output file, not a path; required
output_file = lightcone_cartesian

# dat (ASCII) or fits; default dat
output_format = dat

# the mean displacement of each tracer, displacement_mean_[zspace_]<name>;
# default false
printDisplMean = true

# every realization, displacement_complete_[zspace_]<name>; default false
printDisplComplete = false

# the mean particle separation profile, MPS_[zspace_]<name>, written only
# when no displacement file is (they hold the profile); default false
printMps = false

# the corrected catalogue, reconstructed_catalogue_<name>; must be true with
# perform_recons
printRecCat = true
