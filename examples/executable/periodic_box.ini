# The otswap executable on the periodic_box example: a reconstruction of
# halos in redshift space in a periodic box, with randoms drawn by otswap,
# then the correction to real space.
#
#   otswap examples/executable/periodic_box.ini
#
# run from the repository root: relative paths resolve against the current
# directory. Every key that applies to this run is set, those at their
# default included. "key =", with no value, means "none" for the keys that
# accept it, the same as leaving the key out. The keys are described in
# docs/executable.md.

# ---------------------------------------------------------------- Run

# box or lightcone; required
geometry = box

# what the run reports on stderr: silent, normal or detailed; default normal
verbosity = normal

# ---------------------------------------------------------------- Input

# the tracers, ASCII or FITS by extension; required
tracer_file = examples/data/periodic_halos.dat

# their x, y, z columns, in any unit, which every length below shares:
# indices from 0, or names; required. The file holds x, y, z in real space
# and then z in redshift space: the positions observed are columns 0, 1, 3
column_tracer = 0 1 3

# an integer column of the tracer file read as the tracers' IDs, such as 3;
# default none
id_column =

# the randoms; default none: drawn uniformly in the box given by box_min and
# box_max, or without it in the bounding box of the tracers
random_file =

# the column separator of every ASCII input, " " for a space, \t for a tab;
# default " "
delimiter = " "

# the character that starts a comment line in every ASCII input; default #
comment = "#"

# ---------------------------------------------------------------- Cosmology
# only for the growth rate at the box's redshift, so only with perform_recons

# Omega_m of a flat w0-wa cosmology; required with perform_recons. Here
# (omega_b + omega_c) / h^2 with omega_b = 0.02244 and omega_c = 0.1206
Omega_matter = 0.31864557807975047

# H0 / (100 km/s/Mpc); required with perform_recons
little_h = 0.67

# the dark energy equation of state, w(a) = w0 + wa (1 - a); default -1 and 0
w0 = -1
wa = 0

# ---------------------------------------------------------------- Reconstruction

# number of realizations, each on its own subset of the randoms; default 30; 8
# keeps the example fast. For an analysis, start from the defaults of Nrec and
# threshold: the guide's section "Choosing the parameters" advises on both
Nrec = 8

# convergence threshold of the swap loop, in (0, 1); default 1e-3; 1e-2
# keeps the example fast
threshold = 1e-2

# seed of the random streams; default 0: one is drawn, and written in the
# displacement files
seed = 12345

# grid cell size, in mean particle separations; changes the speed only;
# default 3
mesh_cellsize = 3

# the box, lower and upper x, y, z in coordinate units: required with
# periodic = true. The mean particle separation comes from its volume
box_min = 0 0 0
box_max = 1000 1000 1000

# the mean particle separation, in coordinate units; default none: computed
# from the box, or from the bounding box of the tracers and the randoms
mps =

# the box is periodic: tracers and randoms outside it are wrapped into it and
# distances are minimum-image; needs box_min and box_max, each side an integer
# multiple of the shortest; default false
periodic = true

# ---------------------------------------------------------------- RSD correction

# move the tracers to real space after the reconstruction; default false.
# The box is periodic, so the correction is too: neighbours are found across
# the faces, and each corrected coordinate is wrapped into the box
perform_recons = true

# width of the Gaussian average of the displacements, in coordinate units,
# 0 for none; required with perform_recons. 10 Mpc/h is a starting value, to
# be calibrated on the sample
rsd_smoothing_scale = 10

# weight each neighbour by its number of valid realizations; default false
rsd_weight_by_realizations = false

# the box's redshift, in [0, 10]; required with perform_recons
redshift = 0

# the tracers' linear bias; required with perform_recons
bias = 1.14

# the line of sight: 0, 1 or 2 for x, y or z; required with perform_recons
los_axis = 2

# ---------------------------------------------------------------- Output

# the folder of the output files, created if missing; required
output_dir = examples/executable/output

# the name in every output file, not a path; required
output_file = periodic_box

# dat (ASCII) or fits; default dat
output_format = dat

# the mean displacement of each tracer, displacement_mean_[zspace_]<name>;
# default false
printDisplMean = true

# every realization, displacement_complete_[zspace_]<name>; default false
printDisplComplete = false

# the corrected catalogue, reconstructed_catalogue_<name>; must be true with
# perform_recons
printRecCat = true
